<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Network — Agent Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Top bar ── */
    .top-bar {
      width: 100%;
      max-width: 375px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .top-bar .title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .step-badge {
      font-size: 11px;
      color: #8b8ff5;
      font-weight: 600;
      background: rgba(139,143,245,.12);
      border: 1px solid rgba(139,143,245,.25);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Phone shell (just the rounded border + shadow) ── */
    .phone-shell {
      width: 375px;
      height: 750px;
      border-radius: 44px;
      box-shadow: 0 28px 64px rgba(0,0,0,.8);
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* ── Scrollable viewport inside the shell ── */
    .phone-viewport {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      /* hide scrollbar visually */
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }
    .phone-viewport::-webkit-scrollbar { display: none; }

    /* ── Screen content: full-height image + hotspots positioned over it ── */
    .screen-content {
      position: relative;
      width: 100%;
    }

    .screen-content img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Hotspots sit inside .screen-content, % relative to full image ── */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
    }
    .hotspot:active { opacity: .6; }

    .hotspot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: 0 0 0 3px rgba(139,143,245,.7);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0px rgba(139,143,245,.8); }
      70%  { box-shadow: 0 0 0 8px rgba(139,143,245,0); }
      100% { box-shadow: 0 0 0 0px rgba(139,143,245,0); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="title">Advisor Network — Agent Simulator</span>
    <span class="step-badge" id="step-badge">Step 1 of 7</span>
  </div>

  <div class="phone-shell">
    <div class="phone-viewport" id="viewport">
      <div class="screen-content" id="screen-content">
        <img id="screen-img" src="" alt="App screen" />
        <!-- hotspots injected by JS -->
      </div>
    </div>
  </div>

  <p style="margin-top:10px; font-size:10px; color:#444; text-align:center;">Scroll within the phone · tap highlighted area to advance</p>

<script>
  // Hotspot coords = % of the FULL image (top, left, width, height).
  // Users scroll to find them, just like the real app.
  const screens = [
    {
      id: 's1',
      label: 'Step 1 of 7 — Account overview',
      img: 'screens/screen1.png',
      hotspots: [
        { top: '12%', left: '73%', width: '9%', height: '7%', target: 's2', title: 'Tap + to add account' }
      ]
    },
    {
      id: 's2',
      label: 'Step 2 of 7 — Choose account type',
      img: 'screens/screen2.png',
      hotspots: [
        { top: '77%', left: '5%', width: '90%', height: '12%', target: 's3', title: 'Tap Advisor Network' }
      ]
    },
    {
      id: 's3',
      label: 'Step 3 of 7 — Connect with an advisor',
      img: 'screens/screen3.png',
      hotspots: [
        { top: '83%', left: '5%', width: '90%', height: '10%', target: 's4', title: 'Tap Get started' }
      ]
    },
    {
      id: 's4',
      label: 'Step 4 of 7 — How it works',
      img: 'screens/screen4.png',
      hotspots: [
        { top: '82%', left: '5%', width: '90%', height: '10%', target: 's5', title: 'Tap Got it' }
      ]
    },
    {
      id: 's5',
      label: 'Step 5 of 7 — Let\'s find advisors',
      img: 'screens/screen5.png',
      hotspots: [
        { top: '83%', left: '5%', width: '90%', height: '10%', target: 's6', title: 'Tap Continue' }
      ]
    },
    {
      id: 's6',
      label: 'Step 6 of 7 — What are your main goals?',
      img: 'screens/screen6.png',
      hotspots: [
        { top: '85%', left: '5%', width: '90%', height: '10%', target: 's7', title: 'Tap Continue' }
      ]
    },
    {
      id: 's7',
      label: 'Step 7 of 7 — Major life events',
      img: 'screens/screen7.png',
      hotspots: [
        { top: '85%', left: '5%', width: '90%', height: '10%', target: 's1', title: 'Tap Continue (restart)' }
      ]
    }
  ];

  const screenMap = {};
  screens.forEach(s => screenMap[s.id] = s);

  const viewport = document.getElementById('viewport');
  const content  = document.getElementById('screen-content');
  const img      = document.getElementById('screen-img');
  const badge    = document.getElementById('step-badge');

  function render(screen) {
    // Scroll back to top on each screen change
    viewport.scrollTop = 0;

    img.src = screen.img;
    badge.textContent = screen.label;

    // Remove old hotspots
    content.querySelectorAll('.hotspot').forEach(el => el.remove());

    // Add new hotspots — positioned relative to the full image
    screen.hotspots.forEach(hs => {
      const div = document.createElement('div');
      div.className = 'hotspot';
      div.style.top    = hs.top;
      div.style.left   = hs.left;
      div.style.width  = hs.width;
      div.style.height = hs.height;
      div.title = hs.title || '';
      div.addEventListener('click', () => {
        if (hs.target && screenMap[hs.target]) render(screenMap[hs.target]);
      });
      content.appendChild(div);
    });
  }

  render(screens[0]);
</script>
</body>
</html>
