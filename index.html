<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Network — Agent Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Top bar ── */
    .top-bar {
      width: 100%;
      max-width: 375px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .top-bar .title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .step-badge {
      font-size: 11px;
      color: #8b8ff5;
      font-weight: 600;
      background: rgba(139,143,245,.12);
      border: 1px solid rgba(139,143,245,.25);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Phone frame ── */
    .phone {
      position: relative;
      width: 375px;
      /* height set per screen via JS */
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 28px 64px rgba(0,0,0,.8);
      user-select: none;
    }

    .phone img.screen-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Hotspot base ── */
    .hotspot {
      position: absolute;
      cursor: pointer;
      /* visible during dev — remove border/bg for production */
      /* border: 2px dashed rgba(139,143,245,.5); */
    }
    .hotspot:active { opacity: .7; }

    /* ── Tooltip hint ── */
    .hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 6px;
      font-size: 10px;
      color: rgba(255,255,255,.35);
      letter-spacing: .04em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="title">Advisor Network — Agent Simulator</span>
    <span class="step-badge" id="step-badge">Step 1 of 7</span>
  </div>

  <div class="phone" id="phone">
    <img class="screen-img" id="screen-img" src="" alt="App screen" />
    <!-- hotspots injected by JS -->
  </div>

  <p class="hint" style="margin-top:10px; font-size:10px; color:#444;">Tap highlighted areas to advance</p>

<script>
  // ─────────────────────────────────────────────
  // Screen definitions
  // Each screen: { img, label, hotspots: [{ pct coords, target }] }
  // Hotspot coords are percentages of the image (top, left, width, height)
  // because images vary in resolution.
  // ─────────────────────────────────────────────
  const screens = [
    {
      id: 's1',
      label: 'Step 1 of 7 — Account overview',
      img: 'screens/screen1.png',
      // "+" button is top-right area. Screenshot is 390×844 logical.
      // "+" is roughly at right 8%, top 7%, about 9%w × 5%h
      hotspots: [
        { top: '5%', left: '82%', width: '14%', height: '8%', target: 's2', title: 'Tap + to add account' }
      ]
    },
    {
      id: 's2',
      label: 'Step 2 of 7 — Choose account type',
      img: 'screens/screen2.png',
      // "Advisor Network" row is the 5th option.
      // List starts ~35% from top; each row ~8% tall; AN is row 5 → ~67%–75%
      hotspots: [
        { top: '63%', left: '0%', width: '100%', height: '14%', target: 's3', title: 'Tap Advisor Network' }
      ]
    },
    {
      id: 's3',
      label: 'Step 3 of 7 — Connect with an advisor',
      img: 'screens/screen3.png',
      // "Get started" white button near bottom ~88%
      hotspots: [
        { top: '83%', left: '5%', width: '90%', height: '10%', target: 's4', title: 'Tap Get started' }
      ]
    },
    {
      id: 's4',
      label: 'Step 4 of 7 — How it works',
      img: 'screens/screen4.png',
      // "Got it" black button at ~86%
      hotspots: [
        { top: '82%', left: '5%', width: '90%', height: '10%', target: 's5', title: 'Tap Got it' }
      ]
    },
    {
      id: 's5',
      label: 'Step 5 of 7 — Let\'s find advisors',
      img: 'screens/screen5.png',
      // "Continue" black button at ~88%
      hotspots: [
        { top: '83%', left: '5%', width: '90%', height: '10%', target: 's6', title: 'Tap Continue' }
      ]
    },
    {
      id: 's6',
      label: 'Step 6 of 7 — What are your main goals?',
      img: 'screens/screen6.png',
      // "Continue" black button at ~89%
      hotspots: [
        { top: '85%', left: '5%', width: '90%', height: '10%', target: 's7', title: 'Tap Continue' }
      ]
    },
    {
      id: 's7',
      label: 'Step 7 of 7 — Major life events',
      img: 'screens/screen7.png',
      // "Continue" black button at ~89%; last screen so no target (loop back to start or stop)
      hotspots: [
        { top: '85%', left: '5%', width: '90%', height: '10%', target: 's1', title: 'Tap Continue (restart)' }
      ]
    }
  ];

  // Build index map
  const screenMap = {};
  screens.forEach(s => screenMap[s.id] = s);

  let current = screens[0];

  const phone    = document.getElementById('phone');
  const img      = document.getElementById('screen-img');
  const badge    = document.getElementById('step-badge');

  function render(screen) {
    current = screen;

    // Update image
    img.src = screen.img;

    // Update badge
    badge.textContent = screen.label;

    // Remove old hotspots
    phone.querySelectorAll('.hotspot').forEach(el => el.remove());

    // Add new hotspots
    screen.hotspots.forEach(hs => {
      const div = document.createElement('div');
      div.className = 'hotspot';
      div.style.top    = hs.top;
      div.style.left   = hs.left;
      div.style.width  = hs.width;
      div.style.height = hs.height;
      div.title = hs.title || '';
      div.addEventListener('click', () => {
        if (hs.target && screenMap[hs.target]) {
          render(screenMap[hs.target]);
        }
      });
      phone.appendChild(div);
    });
  }

  render(screens[0]);
</script>
</body>
</html>
