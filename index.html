<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Network — Agent Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
    }

    /* ── Agent Header ── */
    .agent-bar {
      width: 100%;
      max-width: 480px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .agent-bar .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .agent-bar .note {
      font-size: 11px;
      color: #8b8ff5;
      font-weight: 600;
    }

    /* ── Figma Embed Wrapper ── */
    .figma-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
    }

    .figma-wrap iframe {
      width: 480px;
      height: 900px;
      border: none;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,.7);
    }
  </style>
</head>
<body>

  <div class="agent-bar">
    <span class="label">Advisor Network — Agent Simulator</span>
    <span class="note">Figma Prototype</span>
  </div>

  <div class="figma-wrap">
    <iframe
      src="https://www.figma.com/embed?embed_host=share&url=https%3A%2F%2Fwww.figma.com%2Fproto%2FloAbhYKRi6fPgW0e2bOgx7%2FTradePMR---Marketplace%3Fnode-id%3D31261-44163%26p%3Df%26t%3Dla6B8enad6hHHtwh-1%26scaling%3Dscale-down%26content-scaling%3Dfixed%26page-id%3D9839%253A90678"
      allowfullscreen
    ></iframe>
  </div>

</body>
</html>
